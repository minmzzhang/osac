# Ask Copr to rebuild the osac-cli SCM package when fulfillment-service changes
# land on main or a component release tag is pushed. The package-specific
# custom webhook URL selects osac-cli directly; Copr uses the source settings
# stored on the package (currently the monorepo's main branch).
#
# A custom webhook requests a rebuild of the configured source. It does not
# pin the build to the GitHub event's SHA or tag.
#
# Required repository secrets:
#   COPR_CUSTOM_WEBHOOK_URL  -- the package-specific Copr custom webhook URL,
#       e.g. https://copr.fedorainfracloud.org/webhooks/custom/<id>/<uuid>/osac-cli/
#
# The Copr project's SCM source settings must point at osac-project/osac
# (the monorepo), with subdirectory fulfillment-service and spec file
# .copr/osac-cli.spec.

name: Trigger Copr RPM build

on:
  push:
    branches:
      - main
    # paths is evaluated only for branch pushes, not tag pushes -- so tag
    # events matching the tags filter below always fire regardless of which
    # files changed, which is the correct behavior (a release tag should
    # always trigger an RPM build).
    paths:
      - 'fulfillment-service/**'
      - '.copr/**'
    tags:
      - 'fulfillment-service/v*'
  workflow_dispatch:

permissions: {}

jobs:
  trigger-copr:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/fulfillment-service/v')
    name: Trigger Copr build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # No checkout needed -- the workflow only sends an HTTP request.
    steps:
      - name: Notify Copr
        env:
          COPR_CUSTOM_WEBHOOK_URL: ${{ secrets.COPR_CUSTOM_WEBHOOK_URL }}
        run: |
          if [[ -z "${COPR_CUSTOM_WEBHOOK_URL}" ]]; then
            echo "::error::COPR_CUSTOM_WEBHOOK_URL secret is not set"
            exit 1
          fi

          if [[ "${COPR_CUSTOM_WEBHOOK_URL}" != https://copr.fedorainfracloud.org/webhooks/custom/*/osac-cli/ ]]; then
            echo "::error::COPR_CUSTOM_WEBHOOK_URL must be the osac-cli custom webhook URL from Copr"
            exit 1
          fi

          # The custom webhook requires POST. It selects osac-cli from the URL
          # and triggers a rebuild using the SCM source configured in Copr.
          response=$(curl --silent --show-error --max-time 30 \
            --output response.txt \
            --write-out "%{http_code}" \
            --request POST \
            "${COPR_CUSTOM_WEBHOOK_URL}")

          echo "Copr responded with HTTP ${response}"

          if [[ "${response}" -lt 200 ]] || [[ "${response}" -ge 300 ]]; then
            echo "::error::Copr webhook returned HTTP ${response}"
            exit 1
          fi

          response_body=$(cat response.txt)
          if [[ ! "${response_body}" =~ ^[0-9]+$ ]]; then
            echo "::error::Copr returned HTTP ${response} without a numeric build ID"
            exit 1
          fi

          echo "Copr accepted the osac-cli rebuild request; verify the build in the Copr project"
